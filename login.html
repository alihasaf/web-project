<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-yellow-200 to-pink-300 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm text-center">
    <h2 class="mb-6 text-2xl font-bold text-gray-800">Login Form</h2>
    <form id="loginForm" class="flex flex-col gap-4">
      <input type="text" name="username" placeholder="Username" required class="px-4 py-3 rounded-lg border border-gray-200 focus:border-pink-400 bg-gray-50 focus:outline-none text-base" />
      <input type="password" name="password" placeholder="Password" required class="px-4 py-3 rounded-lg border border-gray-200 focus:border-pink-400 bg-gray-50 focus:outline-none text-base" />
      <button type="submit" class="bg-gradient-to-r from-yellow-300 to-pink-400 text-white font-semibold rounded-lg py-3 mt-2 shadow hover:from-pink-400 hover:to-yellow-300 transition-all">Login</button>
    </form>
    <div id="message" class="mt-4 text-pink-700 font-medium min-h-[1.2rem]"></div>
  </div>
  <script>
    document.getElementById('loginForm').onsubmit = async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        username: form.username.value,
        password: form.password.value
      };
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      document.getElementById('message').innerText = result.message;
    }
  </script>
</body>
</html>
